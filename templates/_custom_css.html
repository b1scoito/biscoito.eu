<style>

  /* light mode colors - minimalistic dark theme */
  body {
    --primary-color: #000000;
    --primary-pale-color: #00000020;
    --primary-decoration-color: #00000010;
    --bg-color: #ffffff;
    --text-color: #1a1a1a;
    --text-pale-color: #666666;
    --text-decoration-color: #cccccc;
    --highlight-mark-color: #00000015;

    --callout-note-color: #000000;
    --callout-tip-color: #059669;
    --callout-important-color: #7c3aed;
    --callout-warning-color: #d97706;
    --callout-caution-color: #dc2626;
  }

  /* dark mode colors - minimalistic dark theme */
  body.dark {
    --primary-color: #ffffff;
    --primary-pale-color: #ffffff20;
    --primary-decoration-color: #ffffff10;
    --bg-color: #0a0a0a;
    --text-color: #e5e5e5;
    --text-pale-color: #a3a3a3;
    --text-decoration-color: #404040;
    --highlight-mark-color: #ffffff15;

    --callout-note-color: #ffffff;
    --callout-tip-color: #10b981;
    --callout-important-color: #8b5cf6;
    --callout-warning-color: #f59e0b;
    --callout-caution-color: #ef4444;
  }

  /* typography */
  body {
    --main-font: 'Inter', ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
    --code-font: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
    --homepage-max-width: 720px;
    --main-max-width: 720px;
    --avatar-size: 80px;
    --font-size: 17px;
    --line-height: 1.7;
    --img-border-radius: 8px;
    --detail-border-radius: 8px;
    --dark-mode-img-brightness: 0.8;
    --dark-mode-chart-brightness: 0.8;
    --inline-code-border-radius: 4px;
    --inline-code-bg-color: var(--primary-decoration-color);
    --block-code-border-radius: 8px;
    --block-code-border-color: var(--primary-color);
    --detail-border-color: var(--primary-color);
  }

  /* Additional minimalistic styling */
  .prose h1, .prose h2, .prose h3 {
    font-weight: 600;
    letter-spacing: -0.025em;
  }

  .prose h1 {
    font-size: 2.25rem;
    line-height: 1.2;
  }

  .prose h2 {
    font-size: 1.875rem;
    line-height: 1.3;
  }

  .prose h3 {
    font-size: 1.5rem;
    line-height: 1.4;
  }

  /* Collection styling */
  .collection-wrapper {
    display: grid;
    gap: 1.5rem;
    margin-top: 2rem;
  }

  .card, .card_simple, .box, .art, .art_simple, .entry {
    border: 1px solid var(--text-decoration-color);
    border-radius: 12px;
    padding: 1.5rem;
  }

  /* Callout styling improvements */
  .callout {
    border-radius: 8px;
    border-left: 4px solid;
    padding: 1rem 1.25rem;
    margin: 1.5rem 0;
  }

  .callout.note {
    background: var(--callout-note-color);
    background: linear-gradient(135deg, var(--callout-note-color)10, var(--callout-note-color)05);
    border-left-color: var(--callout-note-color);
  }

  .callout.important {
    background: var(--callout-important-color);
    background: linear-gradient(135deg, var(--callout-important-color)10, var(--callout-important-color)05);
    border-left-color: var(--callout-important-color);
  }

  /* ============================================
     PHOTOGRAPHY PAGE STYLES
     ============================================ */

  /* Photography page: full viewport, minimal UI */
  body.photography-page {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  #photography-container {
    position: relative;
    width: 100%;
    min-height: 100vh;
  }

  /* Minimal navigation */
  .photo-nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 1.5rem 2rem;
    z-index: 100;
    background: linear-gradient(to bottom, var(--bg-color) 0%, transparent 100%);
    pointer-events: none;
  }

  .photo-nav .back-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.5rem;
    height: 2.5rem;
    font-size: 1.5rem;
    color: var(--text-color);
    text-decoration: none;
    background: var(--bg-color);
    border: 1px solid var(--text-decoration-color);
    border-radius: 50%;
    transition: all 0.3s ease;
    pointer-events: auto;
  }

  .photo-nav .back-link:hover {
    background: var(--primary-pale-color);
    transform: translateX(-4px);
  }

  /* Scroll wrapper with snap behavior */
  .photo-scroll-wrapper {
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    overflow-y: scroll;
    height: 100vh;
    width: 100%;
  }

  /* Individual photo sections - gallery style with significant spacing */
  .photo-section {
    scroll-snap-align: center;
    scroll-snap-stop: always;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15vh 2rem;
    position: relative;
    opacity: 0;
    animation: fadeInPhoto 0.8s ease-in-out forwards;
  }

  @keyframes fadeInPhoto {
    to {
      opacity: 1;
    }
  }

  /* Photo content container */
  .photo-content {
    max-width: 1200px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3rem;
  }

  /* Photo image wrapper */
  .photo-image-wrapper {
    width: 100%;
    max-width: 900px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .photo-image {
    width: 100%;
    height: auto;
    max-height: 70vh;
    object-fit: contain;
    border-radius: var(--img-border-radius);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
    cursor: zoom-in;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  body.dark .photo-image {
    filter: brightness(var(--dark-mode-img-brightness));
  }

  .photo-image:hover {
    transform: scale(1.02);
    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.25);
  }

  /* Photo information */
  .photo-info {
    text-align: center;
    max-width: 600px;
    opacity: 0;
    animation: fadeInInfo 1s ease-in-out 0.3s forwards;
  }

  @keyframes fadeInInfo {
    to {
      opacity: 1;
    }
  }

  .photo-title {
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: -0.025em;
    margin: 0 0 0.75rem 0;
    color: var(--text-color);
  }

  .photo-caption {
    font-size: 1.125rem;
    line-height: 1.6;
    color: var(--text-pale-color);
    margin: 0;
  }

  /* Responsive adjustments */
  @media (max-width: 768px) {
    .photo-section {
      padding: 10vh 1rem;
    }

    .photo-content {
      gap: 2rem;
    }

    .photo-image {
      max-height: 60vh;
    }

    .photo-title {
      font-size: 1.5rem;
    }

    .photo-caption {
      font-size: 1rem;
    }

    .photo-nav {
      padding: 1rem 1.5rem;
    }

    .photo-nav .back-link {
      width: 2rem;
      height: 2rem;
      font-size: 1.25rem;
    }
  }

  /* Extra small devices */
  @media (max-width: 480px) {
    .photo-section {
      padding: 8vh 1rem;
    }

    .photo-image {
      max-height: 50vh;
    }

    .photo-title {
      font-size: 1.25rem;
    }

    .photo-caption {
      font-size: 0.9375rem;
    }
  }

  /* Smooth transitions for scroll */
  .photo-section.active {
    transition: opacity 0.5s ease-in-out;
  }

  /* Lightense override for photography page */
  body.photography-page .lightense-open {
    cursor: zoom-out;
  }

</style>
