# Photography Collection
# Each photo includes:
# - img: path to image file (relative to /static/)
# - title: photo title
# - caption: optional description
# - tags: array of tags for music selection
#   - genre: "techno" or "jungle"
#   - mood: descriptive tags like "dark", "vibrant", "intense", "ethereal"

[[collection]]
img = "photos/photo1.jpg"
