title = "cozinha_loader"
subtitle = "Advanced Process Injection"
link = "https://github.com/b1scoito/cozinha_loader"
content = "Tool made using modern C++ that abuses the Windows API to achieve Remote Process Injection based on DLL files. Circumvents common detections by not using common Windows API calls like LoadLibrary and CreateRemoteThread, instead using advanced techniques such as Dynamic Memory Mapping."
tags = ["c++", "process-injection", "windows-api", "evasion"]
